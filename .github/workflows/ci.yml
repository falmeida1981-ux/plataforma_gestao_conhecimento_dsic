name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Base de dados descartável da CI, com os mesmos dois utilizadores de produção (RNF12).
  DATABASE_URL: mysql://dsic_app:dsic_app_ci@127.0.0.1:3306/dsic_ops_ci
  DATABASE_URL_MIGRACOES: mysql://dsic_migracoes:dsic_migracoes_ci@127.0.0.1:3306/dsic_ops_ci
  APP_URL: http://localhost:3100
  PASTA_ANEXOS: ./dados/anexos
  LOG_LEVEL: warn

jobs:
  verificar:
    name: Lint, tipos, testes, auditoria e build
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: dsic_ops_ci
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Criar utilizadores MySQL
        run: ./scripts/ci/criar-utilizadores-mysql.sh
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - name: Aplicar migrações
        run: npm run db:deploy
      - run: npm test
      - run: npm run build
      - run: npm run build:worker
      - name: Auditoria de dependências (RNF07)
        run: npm audit --audit-level=high

  e2e:
    name: Testes ponta a ponta (Playwright)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: dsic_ops_ci
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Criar utilizadores MySQL
        run: ./scripts/ci/criar-utilizadores-mysql.sh
      - run: npm run db:deploy
      - run: npm run db:seed
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  docker:
    name: Build das imagens Docker
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [app, worker, migrate]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          target: ${{ matrix.target }}
          push: false
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
