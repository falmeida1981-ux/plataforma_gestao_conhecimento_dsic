# Nginx no anfitrião, à frente do contentor "app" (RNF01, RNF08).
# Substituir o server_name e os caminhos do certificado interno da CMG.
# Os cabeçalhos de segurança (HSTS, CSP, X-Frame-Options, ...) são definidos pela aplicação.

server {
    listen 80;
    server_name dsic-ops.exemplo.local;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name dsic-ops.exemplo.local;

    ssl_certificate     /etc/nginx/certs/dsic-ops.crt;
    ssl_certificate_key /etc/nginx/certs/dsic-ops.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;

    # Acesso apenas pela rede interna (ajustar às sub-redes da CMG).
    # allow 10.0.0.0/8;
    # deny all;

    # Tamanho máximo dos anexos; manter alinhado com a política de anexos (RNF06).
    client_max_body_size 25m;
    server_tokens off;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
